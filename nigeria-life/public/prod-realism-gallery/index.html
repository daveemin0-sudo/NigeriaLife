<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NigeriaLife — production realism screenshots</title>
  <style>
    :root { color-scheme: dark; --bg:#0f1419; --fg:#f4efe6; --muted:#9aa3ad; }
    body { margin:0; font: 16px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; }
    p { color: var(--muted); margin: 0 0 28px; }
    figure { margin: 0 0 36px; }
    figcaption { margin: 0 0 10px; font-weight: 650; }
    img { display:block; width:100%; height:auto; border-radius: 10px; background:#1a222c; }
    a { color: #8ec8ff; }
  </style>
</head>
<body>
  <main>
    <h1>Production realism screenshots</h1>
    <p>Live build <a href="https://nigeria-life.vercel.app/">nigeria-life.vercel.app</a> · main with all 11 realism layers</p>
    <figure>
      <figcaption>01 — Midday sunny street</figcaption>
      <img src="./prod-realism-01-midday-sunny-street.png" alt="Midday sunny street" />
    </figure>
    <figure>
      <figcaption>02 — Golden hour</figcaption>
      <img src="./prod-realism-02-golden-hour.png" alt="Golden hour" />
    </figure>
    <figure>
      <figcaption>03 — Night lamps and window glow</figcaption>
      <img src="./prod-realism-03-night-lamps-windows.png" alt="Night lamps and window glow" />
    </figure>
    <figure>
      <figcaption>04 — Rainy wet asphalt</figcaption>
      <img src="./prod-realism-04-rainy-wet-asphalt.png" alt="Rainy wet asphalt" />
    </figure>
    <figure>
      <figcaption>05 — Traffic and people presence</figcaption>
      <img src="./prod-realism-05-traffic-people-presence.png" alt="Traffic and people presence" />
    </figure>
    <figure>
      <figcaption>06 — Cinematic chase framing</figcaption>
      <img src="./prod-realism-06-cinematic-chase-framing.png" alt="Cinematic chase framing" />
    </figure>
    <figure>
      <figcaption>07 — Residential interior cutaway</figcaption>
      <img src="./prod-realism-07-residential-interior-cutaway.png" alt="Residential interior cutaway" />
    </figure>
    <figure>
      <figcaption>08 — Abuja city identity</figcaption>
      <img src="./prod-realism-08-abuja-city-identity.png" alt="Abuja city identity" />
    </figure>
    <figure>
      <figcaption>09 — Port Harcourt city identity</figcaption>
      <img src="./prod-realism-09-port-harcourt-city-identity.png" alt="Port Harcourt city identity" />
    </figure>
    <figure>
      <figcaption>10 — Audio ambience caption</figcaption>
      <img src="./prod-realism-10-audio-ambience-caption.png" alt="Audio ambience caption" />
    </figure>
    <figure>
      <figcaption>11 — weather=rainy load</figcaption>
      <img src="./prod-realism-11-weather-param-rainy.png" alt="weather rainy load" />
    </figure>
  </main>
</body>
</html>
